<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SentinelNet - Monitoring History</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .header {
            height: 70px;
            background: #111827;
            border-bottom: 1px solid #334155;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .logo-image {
            width: 46px;
            height: 46px;

            object-fit: contain;

            border-radius: 8px;
        }

        .logo span {
            color: #38bdf8;
        }
        .logo {
    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
}

.logo-image {
    width: 46px;
    height: 46px;

    object-fit: contain;

    border-radius: 8px;
}

.logo span {
    color: #38bdf8;
}

        .connection {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: #22c55e;
        }

        .layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        .sidebar {
            width: 220px;

            background: #111827;
            border-right: 1px solid #334155;

            padding: 25px 15px;
        }

        .sidebar h3 {
            font-size: 12px;
            color: #64748b;

            text-transform: uppercase;

            margin: 0 10px 15px;

            letter-spacing: 1px;
        }

        .nav-item {
            display: block;

            padding: 13px 15px;

            margin-bottom: 5px;

            border-radius: 7px;

            color: #cbd5e1;

            text-decoration: none;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #1e293b;
            color: #38bdf8;
        }

        .main {
            flex: 1;

            padding: 30px;

            overflow-y: auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            margin: 0 0 6px;

            font-size: 28px;
        }

        .page-title p {
            margin: 0;

            color: #94a3b8;
        }

        .panel {
            background: #1e293b;

            border: 1px solid #334155;

            border-radius: 10px;

            padding: 20px;

            margin-bottom: 20px;
        }

        .panel-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .panel-header h2 {
            margin: 0;

            font-size: 18px;
        }

        .record-count {
            color: #94a3b8;

            font-size: 13px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th {
            text-align: left;

            padding: 13px;

            background: #0f172a;

            color: #94a3b8;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            border-bottom: 1px solid #334155;
        }

        td {
            padding: 13px;

            border-bottom: 1px solid #334155;

            font-size: 13px;
        }

        tr:hover {
            background: #263449;
        }

        .normal {
            color: #22c55e;
        }

        .warning {
            color: #f59e0b;
        }

        .danger {
            color: #ef4444;
        }

        .info {
            color: #38bdf8;
        }

        .status {
            display: inline-block;

            padding: 4px 8px;

            border-radius: 5px;

            font-size: 11px;

            font-weight: bold;
        }

        .status-normal {
            background: #14532d;

            color: #86efac;
        }

        .status-medium {
            background: #7c2d12;

            color: #fdba74;
        }

        .status-high,
        .status-critical {
            background: #7f1d1d;

            color: #fca5a5;
        }

        .status-low {
            background: #713f12;

            color: #fde68a;
        }

        .loading {
            color: #94a3b8;

            text-align: center;

            padding: 30px;
        }

        .error {
            color: #fca5a5;

            background: #450a0a;

            border: 1px solid #7f1d1d;

            padding: 15px;

            border-radius: 8px;
        }

        @media (max-width: 700px) {

            .sidebar {
                display: none;
            }

            .main {
                padding: 15px;
            }

        }

        
    </style>

</head>


<body>


<header class="header">

   <div class="logo">

        <img
            src="{{ url_for('static', filename='sentinelnet_logo.png') }}"
            alt="SentinelNet Logo"
            class="logo-image"
        >

        <div class="logo-text">
            SENTINEL<span>NET</span>
        </div>

    </div>




    <div class="connection">

        <div class="status-dot"></div>

        <span>
            Console Connected
        </span>

    </div>

</header>


<div class="layout">


    <aside class="sidebar">

        <h3>
            Navigation
        </h3>


        <a
            href="/"
            class="nav-item"
        >
            Dashboard
        </a>


        <a
            href="/history"
            class="nav-item active"
        >
            History
        </a>


        <a
            href="/processes"
            class="nav-item"
        >
            Processes
        </a>


        <a
            href="/network"
            class="nav-item"
        >
            Network
        </a>


        <a
            href="/reports"
            class="nav-item"
        >
            Reports
        </a>

    </aside>


    <main class="main">


        <div class="page-title">

            <h1>
                Monitoring History
            </h1>

            <p>
                Historical CPU, memory and security analysis records
            </p>

        </div>


        <div class="panel">


            <div class="panel-header">

                <h2>
                    System Monitoring Records
                </h2>

                <div
                    id="recordCount"
                    class="record-count"
                >
                    Loading...
                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Timestamp
                            </th>

                            <th>
                                Agent
                            </th>

                            <th>
                                CPU
                            </th>

                            <th>
                                Memory
                            </th>

                            <th>
                                Anomaly Score
                            </th>

                            <th>
                                Risk Score
                            </th>

                            <th>
                                Severity
                            </th>

                        </tr>

                    </thead>


                    <tbody id="historyTable">

                        <tr>

                            <td
                                colspan="7"
                                class="loading"
                            >
                                Loading monitoring history...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


    </main>

</div>


<script>


async function loadHistory() {

    try {

        const response = await fetch(
            "/api/status"
        );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        const history =
            data.history || [];


        const security =
            data.security_analysis || {};


        const agent =
            data.agent || {};


        const table =
            document.getElementById(
                "historyTable"
            );


        const recordCount =
            document.getElementById(
                "recordCount"
            );


        recordCount.textContent =
            history.length +
            " recent records";


        if (history.length === 0) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="loading"
                    >
                        No monitoring history available.
                    </td>

                </tr>

            `;

            return;

        }


        /*
         * The API provides the latest
         * 50 monitoring records.
         */

        table.innerHTML = "";


        history
            .slice()
            .reverse()
            .forEach(
                (item, index) => {


                    const cpu =
                        Number(
                            item.cpu || 0
                        );


                    const memory =
                        Number(
                            item.memory || 0
                        );


                    /*
                     * The latest record uses
                     * the current ML result.
                     *
                     * Older records may not have
                     * individual ML results returned
                     * by the current API.
                     */

                    let anomalyScore =
                        "--";


                    let riskScore =
                        "--";


                    let severity =
                        "Historical";


                    if (
                        index === 0 &&
                        security.status === "success"
                    ) {

                        anomalyScore =
                            Number(
                                security.anomaly_score
                            ).toFixed(4);


                        riskScore =
                            security.risk_score +
                            "/100";


                        severity =
                            security.severity;

                    }


                    let severityClass =
                        "status-normal";


                    if (
                        severity === "Low"
                    ) {

                        severityClass =
                            "status-low";

                    }


                    if (
                        severity === "Medium"
                    ) {

                        severityClass =
                            "status-medium";

                    }


                    if (
                        severity === "High"
                    ) {

                        severityClass =
                            "status-high";

                    }


                    if (
                        severity === "Critical"
                    ) {

                        severityClass =
                            "status-critical";

                    }


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            ${item.timestamp || "--"}
                        </td>

                        <td>
                            ${agent.agent_id || "--"}
                        </td>

                        <td>
                            ${cpu.toFixed(1)}%
                        </td>

                        <td>
                            ${memory.toFixed(1)}%
                        </td>

                        <td>
                            ${anomalyScore}
                        </td>

                        <td>
                            ${riskScore}
                        </td>

                        <td>

                            <span
                                class="status ${severityClass}"
                            >
                                ${severity}
                            </span>

                        </td>

                    `;


                    table.appendChild(row);

                }
            );


    } catch (error) {

        console.error(
            "History loading error:",
            error
        );


        const table =
            document.getElementById(
                "historyTable"
            );


        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="error"
                >
                    Unable to load monitoring history.
                </td>

            </tr>

        `;

    }

}


/*
 * Load history immediately.
 */

loadHistory();


/*
 * Refresh every 5 seconds.
 */

setInterval(
    loadHistory,
    5000
);


</script>


</body>

</html>
